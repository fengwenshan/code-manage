name: Release

# 合并到 main 即自动发版：递增版本号 → 构建 macOS 与 Windows 安装包
# → 上传到 Gitee 发行版 → 把更新清单提交回两个远端。
# 也可在 Actions 页面手动触发（workflow_dispatch）。
#
# ─────────────────────────────────────────────────────────────
# 一次性配置（必须做完，否则跑不起来）
#
# 1) 仓库密钥（Settings → Secrets and variables → Actions → New repository secret）
#      TAURI_SIGNING_PRIVATE_KEY  更新签名私钥的**内容**
#                                 （即本机 ~/.tauri/risen-tools.key 的全文）
#      GITEE_TOKEN                Gitee 私人令牌，权限范围需含 projects
#    开头的「预检」步骤会检查这两项，缺了会直接秒退并给出明确提示。
#
# 2) 让代码能同时到达 GitHub（Action 的触发源）与 Gitee（发布目标）
#    在本机执行一次，之后一条 git push 即同时推到两个仓库：
#      git remote set-url --add --push origin git@gitee.com:feng_wenshan/project-manage.git
#      git remote set-url --add --push origin git@github.com:fengwenshan/code-manage.git
#
# 3) 版本号规则
#    取 tauri.conf.json 里的 major.minor，patch 位用 GitHub 运行序号：
#    1.0.0 → 1.0.<run_number>。通过 tauri build --config 注入，
#    不改动源文件，因此不会产生提交回环。
#
# 关于提交回环：CI 提交更新清单时带上 [skip ci]，job 上另有守卫条件，
# 所以 CI 自己推的提交不会再次触发构建。
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

# CI 需要把更新清单的提交推回 GitHub（清单必须同时落到两个远端，见下方说明）
permissions:
  contents: write

# 同分支排队执行，避免两次发布并发写同一个发行版
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # CI 自己提交清单时会带上 [skip ci]，这里再兜一层，避免自触发死循环
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    # macOS runner：一台机器同时产出 macOS 安装包与（交叉编译的）Windows 安装包。
    # 公开仓库使用标准 GitHub 托管 runner 是免费的（官方计费文档：
    # "free for public repositories that use standard GitHub-hosted runners"）。
    runs-on: macos-14

    steps:
      # 放在最前面：密钥没配就直接退出，避免白等几分钟工具链安装。
      # 只打印长度、不打印内容，不会泄漏密钥。
      - name: 预检（仓库密钥是否已配置）
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          missing=0
          if [ -z "$SIGN_KEY" ]; then
            echo "::error::缺少仓库密钥 TAURI_SIGNING_PRIVATE_KEY（Settings → Secrets and variables → Actions）"
            missing=1
          else
            echo "TAURI_SIGNING_PRIVATE_KEY 已配置：${#SIGN_KEY} 字节"
          fi
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少仓库密钥 GITEE_TOKEN"
            missing=1
          else
            echo "GITEE_TOKEN 已配置：${#GITEE_TOKEN} 字符"
          fi
          exit $missing

      - name: 拉取代码（需要完整历史来生成 Changelog）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（含 Windows 交叉编译目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-pc-windows-msvc

      - name: 安装交叉编译依赖
        # llvm 提供 llvm-rc（Tauri 用它编译 Windows 资源文件），nsis 提供 makensis
        run: |
          brew install nsis llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-xwin

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 计算版本号
        id: version
        run: |
          BASE=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：$VERSION"

      - name: 配置清单推送目标（GitHub + Gitee 都推）
        # 清单提交必须同时落到两个远端：只推 Gitee 的话，GitHub 的 main 会一直停在
        # 触发 CI 的那一版，下一轮 CI 仍从那个旧提交签出，再推给已前进的 Gitee 就会
        # 非快进被拒（实测第一轮之后必然出现）。
        # GitHub 侧的认证沿用 checkout 写入 git config 的 extraheader，无需额外令牌。
        # 日志里出现的密钥会被 GitHub 自动屏蔽。
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote set-url --add --push origin "https://github.com/fengwenshan/code-manage.git"
          git remote set-url --add --push origin "https://feng_wenshan:${GITEE_TOKEN}@gitee.com/feng_wenshan/project-manage.git"
          git config user.name "冯文山"
          git config user.email "fengwenshan@example.com"

      - name: 构建并发布 macOS（含 dmg）
        # TAURI_BUNDLES=app 跳过 Tauri 自带的 bundle_dmg.sh，改用 --dmg 的
        # hdiutil makehybrid 路径（本地已实测通过）。
        # 若想用 Tauri 原生 dmg（带"拖入应用程序"美化背景），
        # 去掉 TAURI_BUNDLES 与 --dmg 两个参数即可。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAURI_BUNDLES=app node scripts/release.mjs --dmg --version "${{ steps.version.outputs.value }}"

      - name: 构建并发布 Windows（交叉编译）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/release.mjs --target x86_64-pc-windows-msvc --version "${{ steps.version.outputs.value }}"

      - name: 保存产物供人工检查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ steps.version.outputs.value }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14
